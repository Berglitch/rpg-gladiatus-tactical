<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="tokenBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fundo Circular do Token -->
  <circle cx="50" cy="50" r="48" fill="url(#tokenBg)" stroke="#10b981" stroke-width="3" />

  <!-- Orelha Esquerda Pontuda -->
  <polygon points="32,45 8,36 28,58" fill="#15803d" stroke="#052e16" stroke-width="1.5" />
  <polygon points="30,46 14,39 26,55" fill="#86efac" opacity="0.6" />

  <!-- Orelha Direita Pontuda -->
  <polygon points="68,45 92,36 72,58" fill="#15803d" stroke="#052e16" stroke-width="1.5" />
  <polygon points="70,46 86,39 74,55" fill="#86efac" opacity="0.6" />

  <!-- Ombro e Armadura de Couro com rebites -->
  <path d="M22 88 Q50 72 78 88 L85 100 L15 100 Z" fill="url(#leather)" stroke="#292524" stroke-width="2" />
  <circle cx="34" cy="88" r="2" fill="#d97706" />
  <circle cx="66" cy="88" r="2" fill="#d97706" />

  <!-- Cabeça e Queixo pontudo do Goblin -->
  <path d="M30 38 C30 22 70 22 70 38 C70 54 62 74 50 78 C38 74 30 54 30 38 Z" fill="url(#skin)" stroke="#052e16" stroke-width="2" filter="url(#shadow)" />

  <!-- Nariz pontudo clássico de goblin -->
  <polygon points="50,44 45,58 55,58" fill="#16a34a" stroke="#052e16" stroke-width="1" />

  <!-- Olhos Amarelos e Ferozes -->
  <!-- Olho Esquerdo -->
  <path d="M37 42 Q43 38 46 44 Q41 46 37 42 Z" fill="#facc15" stroke="#713f12" stroke-width="1" />
  <circle cx="42" cy="43" r="2" fill="#451a03" />
  <circle cx="42.5" cy="42.5" r="0.6" fill="#fff" />

  <!-- Olho Direito -->
  <path d="M63 42 Q57 38 54 44 Q59 46 63 42 Z" fill="#facc15" stroke="#713f12" stroke-width="1" />
  <circle cx="58" cy="43" r="2" fill="#451a03" />
  <circle cx="58.5" cy="42.5" r="0.6" fill="#fff" />

  <!-- Sobrancelhas franzidas -->
  <path d="M35 38 Q42 41 46 40" stroke="#052e16" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M65 38 Q58 41 54 40" stroke="#052e16" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Boca e Presas Afiadas -->
  <path d="M38 65 Q50 72 62 65 Q50 63 38 65 Z" fill="#450a0a" stroke="#052e16" stroke-width="1.2" />
  <!-- Dentes/Presas inferiores apontando para cima -->
  <polygon points="41,66 43,60 45,66" fill="#fef08a" />
  <polygon points="55,66 57,60 59,66" fill="#fef08a" />

  <!-- Cicatriz de guerra no rosto -->
  <line x1="39" y1="33" x2="43" y2="40" stroke="#991b1b" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Borda metálica do Pog/Token Roll20 -->
  <circle cx="50" cy="50" r="47.5" fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.9" />
</svg>
